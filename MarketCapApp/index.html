<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Top 20 US Companies by Market Cap</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Top 20 US Companies by Market Cap</h1>
        <p class="subtitle">Source: Yahoo Finance via <code>yfinance</code></p>
        <p class="meta" id="meta">Loading…</p>
      </header>

      <table id="table" hidden>
        <thead>
          <tr>
            <th class="rank">#</th>
            <th>Company</th>
            <th>Ticker</th>
            <th class="num">Market Cap</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>

      <p id="error" class="error" hidden></p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
