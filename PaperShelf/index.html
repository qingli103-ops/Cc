<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PaperShelf</title>
<style>
  :root {
    --bg: #f6f5f1;
    --panel: #ffffff;
    --ink: #1d2127;
    --muted: #6b7280;
    --line: #e4e2db;
    --accent: #2f6f4e;
    --accent-soft: #e7f0ea;
    --danger: #b4453a;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 6px 18px rgba(0,0,0,.05);
    --r: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.45;
  }
  button { font-family: inherit; cursor: pointer; }

  /* ── Layout ── */
  .app { display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
  .sidebar { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* ── Sidebar ── */
  .brand { padding: 18px 18px 10px; font-weight: 700; font-size: 17px; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); flex: none; }
  .brand small { font-weight: 500; color: var(--muted); font-size: 11px; }

  .folder-strip {
    margin: 4px 12px 10px; padding: 9px 12px; border: 1px solid var(--line);
    border-radius: 9px; background: #fbfaf7; display: flex; align-items: center; gap: 8px; font-size: 12.5px;
  }
  .folder-strip .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--accent); font-weight: 600; }
  .folder-strip button { border: none; background: none; font-size: 12px; color: var(--muted); padding: 2px 5px; border-radius: 5px; }
  .folder-strip button:hover { background: #eee; }

  .open-folder-btn {
    margin: 6px 12px 10px; padding: 10px 12px; border: none; border-radius: 9px;
    background: var(--accent); color: #fff; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .open-folder-btn:hover { filter: brightness(1.05); }
  .open-folder-btn svg { flex: none; }

  .nav { overflow-y: auto; padding: 4px 8px 12px; flex: 1; min-height: 0; }
  .nav-head {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); padding: 12px 10px 5px; font-weight: 700;
    display: flex; justify-content: space-between; align-items: center;
  }
  .nav-head button { border: none; background: none; color: var(--muted); font-size: 15px; line-height: 1; padding: 0 2px; border-radius: 4px; }
  .nav-head button:hover { color: var(--accent); background: var(--accent-soft); }

  .cat { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
  .cat:hover { background: #f1efe9; }
  .cat.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .cat .swatch { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .cat .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat .count { font-size: 11px; color: var(--muted); background: #efeee8; padding: 1px 7px; border-radius: 10px; }
  .cat.active .count { background: #fff; }
  .cat .del { display: none; border: none; background: none; color: var(--muted); font-size: 14px; padding: 0 2px; }
  .cat:hover .del { display: inline; }
  .cat .del:hover { color: var(--danger); }

  /* ── Topbar ── */
  .topbar { padding: 14px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; background: var(--panel); }
  .search { flex: 1; position: relative; max-width: 520px; }
  .search input { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--line); border-radius: 9px; font-size: 14px; background: #fbfaf7; color: var(--ink); }
  .search input:focus { outline: none; border-color: var(--accent); background: #fff; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .sort { padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: #fbfaf7; color: var(--ink); }
  .rescan { padding: 8px 13px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); font-weight: 600; font-size: 13px; white-space: nowrap; }
  .rescan:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .crumb { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .crumb b { color: var(--ink); font-weight: 600; }

  /* ── Content / grid ── */
  .content { flex: 1; overflow-y: auto; padding: 22px; min-height: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 9px; cursor: pointer; transition: .12s; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,.09), 0 12px 28px rgba(0,0,0,.07); }
  .card .ttl { font-weight: 650; font-size: 14.5px; line-height: 1.3; letter-spacing: -.01em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .foot { display: flex; align-items: center; gap: 8px; margin-top: auto; flex-wrap: wrap; }
  .pill { font-size: 11px; padding: 2px 9px; border-radius: 20px; background: #f1efe9; color: var(--muted); white-space: nowrap; }
  .pill.cat-pill { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: #eef1f4; color: #51607a; }
  .card .year { font-size: 12px; color: var(--muted); margin-left: auto; }
  .card .unread-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }

  /* ── Welcome splash ── */
  .splash { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--muted); text-align: center; padding: 40px; }
  .splash .icon { font-size: 52px; margin-bottom: 16px; }
  .splash h2 { color: var(--ink); margin: 0 0 8px; font-size: 21px; }
  .splash p { max-width: 360px; margin: 0 0 24px; font-size: 14.5px; }
  .splash .compat { font-size: 12px; background: #f1efe9; padding: 10px 16px; border-radius: 8px; color: var(--muted); }
  .splash .big-btn { padding: 12px 28px; border: none; border-radius: 10px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 9px; }
  .splash .big-btn:hover { filter: brightness(1.05); }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }

  /* ── Reader ── */
  .reader { position: fixed; inset: 0; background: rgba(20,22,26,.55); display: none; z-index: 50; }
  .reader.open { display: grid; grid-template-columns: 1fr 360px; }
  .reader .pdf { background: #33373d; }
  .reader .pdf iframe { width: 100%; height: 100%; border: none; display: block; }
  .reader .side { background: var(--panel); display: flex; flex-direction: column; min-height: 0; box-shadow: -8px 0 28px rgba(0,0,0,.2); }
  .side-head { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .side-head .x { margin-left: auto; border: none; background: #f1efe9; width: 30px; height: 30px; border-radius: 8px; font-size: 17px; color: var(--ink); }
  .side-head .x:hover { background: #e4e2db; }
  .side-body { padding: 18px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
  .field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin-bottom: 5px; }
  .field input, .field select, .field textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13.5px; font-family: inherit; background: #fbfaf7; color: var(--ink); }
  .field textarea { resize: vertical; min-height: 60px; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); background: #fff; }
  .field .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .side-foot { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; }
  .side-foot button { flex: 1; padding: 9px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-weight: 600; color: var(--ink); }
  .side-foot .save { background: var(--accent); color: #fff; border-color: var(--accent); }
  .side-foot .save:hover { filter: brightness(1.05); }

  /* ── New category modal ── */
  .modal { position: fixed; inset: 0; background: rgba(20,22,26,.45); display: none; align-items: center; justify-content: center; z-index: 60; }
  .modal.open { display: flex; }
  .modal .box { background: var(--panel); border-radius: var(--r); padding: 22px; width: 340px; box-shadow: var(--shadow); }
  .modal h3 { margin: 0 0 14px; font-size: 16px; }
  .modal input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; font-size: 14px; margin-bottom: 14px; }
  .modal input:focus { outline: none; border-color: var(--accent); }
  .modal .row { display: flex; gap: 10px; }
  .modal .row button { flex: 1; padding: 9px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-weight: 600; }
  .modal .row .ok { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ── Busy / Toast ── */
  .busy { position: fixed; top: 14px; right: 18px; background: var(--ink); color: #fff; padding: 9px 14px; border-radius: 9px; font-size: 12.5px; display: none; align-items: center; gap: 8px; z-index: 80; }
  .busy.show { display: flex; }
  .spin { width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: sp .7s linear infinite; flex: none; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; opacity: 0; transition: .25s; pointer-events: none; z-index: 90; white-space: nowrap; }
  .toast.show { opacity: 1; }

  @media (max-width: 700px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .reader.open { grid-template-columns: 1fr; }
    .reader .pdf { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span> PaperShelf <small>· local</small></div>
    <div id="folderStrip" style="display:none" class="folder-strip">
      📁 <span class="fname" id="folderName"></span>
      <button id="changeFolder" title="Change folder">⇄</button>
    </div>
    <button class="open-folder-btn" id="openFolderBtn" style="display:none">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Open folder
    </button>
    <nav class="nav" id="nav">
      <div class="nav-head">Categories <button id="navAdd" title="New category">+</button></div>
    </nav>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <div class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search" placeholder="Search title, author, tag, notes…" />
      </div>
      <select class="sort" id="sort">
        <option value="added">Folder order</option>
        <option value="year">Year (newest)</option>
        <option value="title">Title A–Z</option>
        <option value="author">Author A–Z</option>
      </select>
      <button class="rescan" id="rescanBtn" style="display:none">↺ Rescan</button>
      <span class="crumb" id="crumb"></span>
    </div>
    <div class="content" id="content">
      <!-- filled by render() -->
    </div>
  </main>
</div>

<!-- Reader -->
<div class="reader" id="reader">
  <div class="pdf"><iframe id="pdfFrame" title="PDF viewer"></iframe></div>
  <div class="side">
    <div class="side-head">
      <strong style="font-size:14px">Paper details</strong>
      <button class="x" id="readerClose">×</button>
    </div>
    <div class="side-body">
      <div class="field"><label>Title</label><textarea id="fTitle" rows="2"></textarea></div>
      <div class="field"><label>Authors</label><input id="fAuthors" /></div>
      <div class="field"><label>Year</label><input id="fYear" /></div>
      <div class="field"><label>Category</label><select id="fCategory"></select></div>
      <div class="field"><label>Tags <span style="font-weight:500;text-transform:none">(comma-separated)</span></label><input id="fTags" /></div>
      <div class="field"><label>Notes</label><textarea id="fNotes" rows="5" placeholder="Key findings, why it matters…"></textarea></div>
      <div class="field"><small id="fInfo" style="color:var(--muted)"></small></div>
    </div>
    <div class="side-foot">
      <button class="save" id="fSave">Save</button>
    </div>
  </div>
</div>

<!-- Category modal -->
<div class="modal" id="catModal">
  <div class="box">
    <h3>New category</h3>
    <input id="catName" placeholder="e.g. Kidney organoids" />
    <div class="row">
      <button id="catCancel">Cancel</button>
      <button class="ok" id="catCreate">Create</button>
    </div>
  </div>
</div>

<div class="busy" id="busy"><span class="spin"></span><span id="busyText">Scanning…</span></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
"use strict";
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

// ─── Check browser support ───────────────────────────────────────────────────
const HAS_FSA = "showDirectoryPicker" in window;

// ─── IndexedDB ───────────────────────────────────────────────────────────────
const DB_NAME = "papershelf2", DB_VER = 1;
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      ["papers","kv"].forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: s === "kv" ? "key" : "fileName" }); });
    };
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
}
const tx = (s, m) => db.transaction(s, m).objectStore(s);
const idbPut = (s, v) => new Promise((res, rej) => { const r = tx(s,"readwrite").put(v); r.onsuccess = res; r.onerror = () => rej(r.error); });
const idbGet = (s, k) => new Promise((res, rej) => { const r = tx(s,"readonly").get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const idbAll = (s) => new Promise((res, rej) => { const r = tx(s,"readonly").getAll(); r.onsuccess = () => res(r.result||[]); r.onerror = () => rej(r.error); });

// ─── State ───────────────────────────────────────────────────────────────────
let dirHandle = null;   // FileSystemDirectoryHandle
let papers = [];        // [{fileName, title, authors, year, category, tags[], notes, added}]
let categories = [];    // [{id, name}]
let activeCat = "all";
let searchTerm = "";
let sortBy = "added";
let editingFileName = null;
let currentBlobUrl = null;

// ─── Helpers ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg) { const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2400); }
function busy(on, text) { $("busyText").textContent=text||"Working…"; $("busy").classList.toggle("show",!!on); }

// ─── KV persistence ──────────────────────────────────────────────────────────
async function kvGet(k) { const r = await idbGet("kv",k); return r ? r.value : null; }
async function kvPut(k, v) { await idbPut("kv", { key:k, value:v }); }

// ─── Metadata extraction ─────────────────────────────────────────────────────
async function extractMeta(arrayBuffer, fallback) {
  const out = { title:"", authors:"", year:"" };
  try {
    const doc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    try {
      const m = await doc.getMetadata();
      const info = (m && m.info) || {};
      if (info.Title && info.Title.trim().length > 4 && !/^(untitled|microsoft word|\d+)/i.test(info.Title))
        out.title = info.Title.trim();
      if (info.Author && info.Author.trim().length > 1) out.authors = info.Author.trim();
    } catch(e){}
    const page = await doc.getPage(1);
    const tc = await page.getTextContent();
    const items = tc.items.filter(i => i.str && i.str.trim());
    const lines = [];
    items.forEach(it => {
      const y = Math.round(it.transform[5]);
      const sz = Math.hypot(it.transform[0], it.transform[1]);
      let l = lines.find(l => Math.abs(l.y-y)<4);
      if (!l) { l={y,sz:0,text:""}; lines.push(l); }
      l.text += it.str; l.sz = Math.max(l.sz,sz);
    });
    lines.sort((a,b)=>b.y-a.y);
    if (!out.title && lines.length) {
      const top = lines.slice(0, Math.min(lines.length,18));
      const maxSz = Math.max(...top.map(l=>l.sz));
      let parts=[];
      for (const l of top) {
        const t = l.text.trim();
        if (l.sz >= maxSz-0.6 && t.length>1 && !/^\d+$/.test(t)) parts.push(t);
        else if (parts.length) break;
      }
      const cand = parts.join(" ").replace(/\s+/g," ").trim();
      if (cand.length>6 && cand.length<320) out.title = cand;
    }
    let txt = lines.map(l=>l.text).join(" ");
    if (doc.numPages>1) {
      try { const p2=await doc.getPage(2); const t2=await p2.getTextContent(); txt+=" "+t2.items.map(i=>i.str).join(" "); } catch(e){}
    }
    const yrs = (txt.match(/\b(19|20)\d{2}\b/g)||[]).map(Number).filter(y=>y>=1950&&y<=new Date().getFullYear()+1);
    if (yrs.length) {
      const freq={}; yrs.forEach(y=>(freq[y]=(freq[y]||0)+1));
      out.year = String(Object.keys(freq).sort((a,b)=>freq[b]-freq[a]||b-a)[0]);
    }
    await doc.destroy();
  } catch(e){ console.warn("extract:", e); }
  if (!out.title) out.title = (fallback||"Untitled").replace(/\.pdf$/i,"");
  return out;
}

// ─── Folder access ───────────────────────────────────────────────────────────
async function pickFolder() {
  if (!HAS_FSA) { alert("Your browser doesn't support the File System Access API.\n\nUse Chrome or Edge on Windows."); return; }
  try {
    dirHandle = await window.showDirectoryPicker({ mode:"read" });
    await kvPut("dirHandle", dirHandle);
    await kvPut("dirName", dirHandle.name);
    await scanFolder(true);
  } catch(e) {
    if (e.name !== "AbortError") console.error(e);
  }
}

async function restoreFolder() {
  try {
    const h = await kvGet("dirHandle");
    if (!h) return false;
    const perm = await h.queryPermission({ mode:"read" });
    if (perm === "granted") { dirHandle = h; return true; }
    // Need to re-request (requires a user gesture — handled by the "Reconnect" button)
    dirHandle = h;
    return false; // caller shows the reconnect button
  } catch(e) { return false; }
}

async function reconnectFolder() {
  if (!dirHandle) return;
  try {
    const perm = await dirHandle.requestPermission({ mode:"read" });
    if (perm === "granted") await scanFolder(false);
    else toast("Permission denied — please re-open the folder.");
  } catch(e) { console.error(e); }
}

async function scanFolder(firstTime) {
  if (!dirHandle) return;
  busy(true, "Scanning folder…");
  $("rescanBtn").style.display = "";
  // Show name
  $("folderName").textContent = dirHandle.name;
  $("folderStrip").style.display = "";
  $("openFolderBtn").style.display = "none";

  const existing = Object.fromEntries(papers.map(p=>[p.fileName,p]));
  const freshFileNames = new Set();
  const toExtract = [];

  for await (const [name, handle] of dirHandle.entries()) {
    if (handle.kind !== "file" || !/\.pdf$/i.test(name)) continue;
    freshFileNames.add(name);
    if (!existing[name]) toExtract.push({ name, handle });
  }

  // remove papers no longer in folder
  const removedCount = papers.filter(p=>!freshFileNames.has(p.fileName)).length;
  papers = papers.filter(p=>freshFileNames.has(p.fileName));

  // extract new papers
  let n=0;
  for (const { name, handle } of toExtract) {
    n++;
    busy(true, `Reading ${n}/${toExtract.length}: ${name.slice(0,32)}…`);
    let meta = { title:"", authors:"", year:"" };
    try {
      const file = await handle.getFile();
      const buf = await file.arrayBuffer();
      meta = await extractMeta(buf, name);
    } catch(e){ console.warn(name, e); meta.title = name.replace(/\.pdf$/i,""); }
    const paper = { fileName:name, title:meta.title, authors:meta.authors, year:meta.year, category:"", tags:[], notes:"", added:Date.now() };
    await idbPut("papers", paper);
    papers.push(paper);
  }

  busy(false);
  render();
  const msgs = [];
  if (firstTime || toExtract.length) msgs.push(`${papers.length} PDF${papers.length!==1?"s":""} found`);
  if (toExtract.length) msgs.push(`${toExtract.length} new`);
  if (removedCount) msgs.push(`${removedCount} removed`);
  if (msgs.length) toast(msgs.join(" · "));
}

// ─── Reader ──────────────────────────────────────────────────────────────────
async function openReader(fileName) {
  if (!dirHandle) return;
  const p = papers.find(x=>x.fileName===fileName);
  if (!p) return;
  editingFileName = fileName;

  busy(true, "Opening…");
  try {
    const fh = await dirHandle.getFileHandle(fileName);
    const file = await fh.getFile();
    if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
    currentBlobUrl = URL.createObjectURL(file);
    $("pdfFrame").src = currentBlobUrl;
  } catch(e) { toast("Couldn't open file — it may have moved or been renamed."); busy(false); return; }
  busy(false);

  $("fTitle").value = p.title||"";
  $("fAuthors").value = p.authors||"";
  $("fYear").value = p.year||"";
  $("fTags").value = (p.tags||[]).join(", ");
  $("fNotes").value = p.notes||"";
  const sel = $("fCategory");
  sel.innerHTML = `<option value="">— Uncategorized —</option>` +
    categories.map(c=>`<option value="${c.id}" ${c.id===p.category?"selected":""}>${esc(c.name)}</option>`).join("");
  $("fInfo").textContent = `${fileName} · added ${new Date(p.added).toLocaleDateString()}`;
  $("reader").classList.add("open");
}

function closeReader() {
  $("reader").classList.remove("open");
  $("pdfFrame").src="about:blank";
  if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl=null; }
  editingFileName = null;
}

async function saveEdit() {
  const p = papers.find(x=>x.fileName===editingFileName);
  if (!p) return;
  p.title = $("fTitle").value.trim()||p.title;
  p.authors = $("fAuthors").value.trim();
  p.year = $("fYear").value.trim();
  p.category = $("fCategory").value;
  p.tags = $("fTags").value.split(",").map(t=>t.trim()).filter(Boolean);
  p.notes = $("fNotes").value;
  await idbPut("papers", p);
  render();
  toast("Saved");
}

// ─── Categories ───────────────────────────────────────────────────────────────
async function saveCats() { await kvPut("categories", categories); }
function openCatModal() { $("catModal").classList.add("open"); $("catName").value=""; setTimeout(()=>$("catName").focus(),30); }
function closeCatModal() { $("catModal").classList.remove("open"); }
async function createCat() {
  const name=$("catName").value.trim(); if(!name)return;
  categories.push({id:uid(),name});
  await saveCats(); closeCatModal(); render();
}
async function deleteCat(id) {
  if (!confirm("Delete this category? Papers stay; they become uncategorized.")) return;
  categories=categories.filter(c=>c.id!==id);
  for (const p of papers) if (p.category===id) { p.category=""; await idbPut("papers",p); }
  if (activeCat===id) activeCat="all";
  await saveCats(); render();
}

// ─── Render ───────────────────────────────────────────────────────────────────
function visiblePapers() {
  let list = papers.slice();
  if (activeCat==="uncat") list=list.filter(p=>!p.category);
  else if (activeCat!=="all") list=list.filter(p=>p.category===activeCat);
  if (searchTerm) {
    const q=searchTerm.toLowerCase();
    list=list.filter(p=>(p.title||"").toLowerCase().includes(q)||(p.authors||"").toLowerCase().includes(q)||(p.tags||[]).join(" ").toLowerCase().includes(q)||(p.notes||"").toLowerCase().includes(q));
  }
  list.sort((a,b)=>{
    if(sortBy==="year") return (Number(b.year)||0)-(Number(a.year)||0);
    if(sortBy==="title") return (a.title||"").localeCompare(b.title||"");
    if(sortBy==="author") return (a.authors||"").localeCompare(b.authors||"");
    return b.added-a.added;
  });
  return list;
}

function renderNav() {
  const counts = { all:papers.length, uncat:papers.filter(p=>!p.category).length };
  categories.forEach(c=>(counts[c.id]=papers.filter(p=>p.category===c.id).length));
  const palette=["#2f6f4e","#3b6ea5","#a55b2f","#7a4fa3","#b4453a","#2f8f8f","#94782f"];
  const item = (id, label, sw) =>
    `<div class="cat ${activeCat===id?"active":""}" data-cat="${id}">
      <span class="swatch" style="background:${sw||"transparent"}"></span>
      <span class="label">${esc(label)}</span>
      <span class="count">${counts[id]||0}</span>
      ${id!=="all"&&id!=="uncat"?`<button class="del" data-delcat="${id}">×</button>`:""}
    </div>`;
  let html = item("all","All papers","#9aa3af");
  html += `<div class="nav-head" style="margin-top:8px">Categories <button id="navAdd" title="New category">+</button></div>`;
  categories.forEach((c,i)=>(html+=item(c.id,c.name,palette[i%palette.length])));
  html += item("uncat","Uncategorized","#c4c1b8");
  $("nav").innerHTML = html;
  $("nav").querySelector("#navAdd").onclick = openCatModal;
}

function renderGrid() {
  const content = $("content");
  if (!dirHandle) {
    content.innerHTML = `
      <div class="splash">
        <div class="icon">📂</div>
        <h2>Open your papers folder</h2>
        <p>Point PaperShelf at the folder where you save downloaded PDFs on your Windows PC. It reads them directly from disk — nothing is copied or uploaded.</p>
        <button class="big-btn" id="splashOpen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          Choose folder
        </button>
        <p class="compat" style="margin-top:20px">Requires Chrome or Edge on Windows (File System Access API).</p>
      </div>`;
    $("splashOpen").onclick = pickFolder;
    $("crumb").innerHTML="";
    return;
  }
  const list = visiblePapers();
  $("crumb").innerHTML = `<b>${list.length}</b> paper${list.length===1?"":"s"}`;
  if (!list.length) {
    content.innerHTML=`<div class="empty">${papers.length?"No papers match your filters.":"No PDFs found in this folder."}</div>`;
    return;
  }
  const catName = id => { const c=categories.find(c=>c.id===id); return c?c.name:null; };
  content.innerHTML = `<div class="grid">${list.map(p=>{
    const cn=catName(p.category);
    const tags=(p.tags||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
    return `<div class="card" data-fn="${esc(p.fileName)}">
      <div class="ttl">${esc(p.title)}</div>
      <div class="meta">${esc(p.authors)||`<span style="opacity:.55">Authors not detected</span>`}</div>
      <div class="foot">
        ${cn?`<span class="pill cat-pill">${esc(cn)}</span>`:""}
        ${tags}
        <span class="year">${esc(p.year)||""}</span>
      </div>
    </div>`;
  }).join("")}</div>`;
}

function render() { renderNav(); renderGrid(); }

// ─── Events ───────────────────────────────────────────────────────────────────
$("openFolderBtn").onclick = pickFolder;
$("changeFolder").onclick = pickFolder;
$("rescanBtn").onclick = () => scanFolder(false);
$("search").oninput = e => { searchTerm=e.target.value; renderGrid(); };
$("sort").onchange = e => { sortBy=e.target.value; renderGrid(); };
$("readerClose").onclick = closeReader;
$("fSave").onclick = saveEdit;
$("catCancel").onclick = closeCatModal;
$("catCreate").onclick = createCat;
$("catName").addEventListener("keydown", e => { if(e.key==="Enter")createCat(); });
$("catModal").addEventListener("click", e => { if(e.target.id==="catModal")closeCatModal(); });
document.addEventListener("keydown", e => { if(e.key==="Escape"){closeReader();closeCatModal();} });

document.addEventListener("click", e => {
  const delBtn = e.target.closest("[data-delcat]");
  if (delBtn) { e.stopPropagation(); deleteCat(delBtn.dataset.delcat); return; }
  const catEl = e.target.closest("[data-cat]");
  if (catEl) { activeCat=catEl.dataset.cat; render(); return; }
  const card = e.target.closest("[data-fn]");
  if (card) openReader(card.dataset.fn);
});

// ─── Boot ─────────────────────────────────────────────────────────────────────
(async function init() {
  if (!HAS_FSA) {
    // Fallback message baked into the splash; just render
    await openDB();
    categories = await kvGet("categories") || defaultCats();
    render();
    return;
  }
  await openDB();
  papers = await idbAll("papers");
  categories = await kvGet("categories") || defaultCats();
  await saveCats();

  // Show open-folder button while we check permission
  $("openFolderBtn").style.display = "";

  const restored = await restoreFolder();
  if (!restored && dirHandle) {
    // Has a handle but permission lapsed — show reconnect prompt
    const name = await kvGet("dirName") || "your folder";
    $("folderName").textContent = name;
    $("folderStrip").style.display = "";
    $("openFolderBtn").textContent = `↺ Reconnect "${name}"`;
    $("openFolderBtn").onclick = reconnectFolder;
    render();
  } else if (restored) {
    await scanFolder(false);
  } else {
    render(); // show splash
  }
})();

function defaultCats() {
  return [
    {id:uid(), name:"To read"},
    {id:uid(), name:"Methods / protocols"},
    {id:uid(), name:"Key references"},
  ];
}
</script>
