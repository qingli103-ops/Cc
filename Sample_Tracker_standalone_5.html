document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"f0e686e3-5597-4205-abba-3448e6d495cf\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<style>\n  :root{\n    --bg:#0b0f17;--panel:#111827;--panel2:#1a2332;--line:#243042;\n    --txt:#e8ecf1;--muted:#6b7d94;--accent:#38bdf8;--accent2:#5eead4;\n    --good:#34d399;--warn:#fbbf24;--bad:#f87171;--pill:#1e293b;\n    --glass:rgba(17,24,39,.72);\n  }\n  [data-dc-theme=\"light\"]{\n    --bg:#f0f4f8;--panel:#ffffff;--panel2:#f1f5f9;--line:#e2e8f0;\n    --txt:#0f172a;--muted:#64748b;--accent:#0284c7;--accent2:#0d9488;\n    --good:#059669;--warn:#d97706;--bad:#dc2626;--pill:#e2e8f0;\n    --glass:rgba(255,255,255,.78);\n  }\n  /* ---- dark-mode background presets (only apply in dark) ---- */\n  [data-dc-theme=\"dark\"][data-bg=\"midnight\"]{--bg:#0b0f17;--panel:#111827;--panel2:#1a2332;--line:#243042;--accent:#38bdf8;--accent2:#5eead4;--pill:#1e293b;--glass:rgba(17,24,39,.72)}\n  [data-dc-theme=\"dark\"][data-bg=\"ocean\"]{--bg:#06182e;--panel:#0c2742;--panel2:#123353;--line:#1c4368;--accent:#38bdf8;--accent2:#5eead4;--pill:#103052;--glass:rgba(12,39,66,.74)}\n  [data-dc-theme=\"dark\"][data-bg=\"indigo\"]{--bg:#0c0e20;--panel:#161a36;--panel2:#20264c;--line:#2e376a;--accent:#818cf8;--accent2:#c4b5fd;--pill:#1c2147;--glass:rgba(22,26,54,.74)}\n  [data-dc-theme=\"dark\"][data-bg=\"royal\"]{--bg:#0a1033;--panel:#141c4d;--panel2:#1d2960;--line:#2a3a82;--accent:#60a5fa;--accent2:#a5b4fc;--pill:#18215a;--glass:rgba(20,28,77,.76)}\n  [data-dc-theme=\"dark\"][data-bg=\"teal\"]{--bg:#04181b;--panel:#0a2a30;--panel2:#103940;--line:#1a525c;--accent:#2dd4bf;--accent2:#7dd3fc;--pill:#0d343b;--glass:rgba(10,42,48,.74)}\n  [data-dc-theme=\"dark\"][data-bg=\"aurora\"]{--bg:radial-gradient(125% 90% at 18% -12%,#243266 0%,#0a0f24 56%);--panel:#131a38;--panel2:#1c2547;--line:#2a3566;--accent:#7dd3fc;--accent2:#c4b5fd;--pill:#1a2245;--glass:rgba(19,26,56,.76)}\n  *{box-sizing:border-box}\n  html,body{margin:0}\n  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}\n  @keyframes dcSlideDown{from{transform:translateY(-10px);opacity:0}to{transform:translateY(0);opacity:1}}\n  @keyframes dcRowEnter{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}\n  @keyframes dcScaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}\n  @keyframes dcPopIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}\n  @keyframes dcSwatchIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}\n  @keyframes dcFlash{0%{background:rgba(56,189,248,.18)}100%{background:transparent}}\n  .dc-flash{animation:dcFlash 1s ease-out}\n  .dc-rowenter{animation:dcRowEnter .35s ease}\n  ::-webkit-scrollbar{width:9px;height:9px}\n  ::-webkit-scrollbar-track{background:transparent}\n  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}\n  ::-webkit-scrollbar-thumb:hover{background:var(--muted)}\n  /* ---- aurora button hover effect ---- */\n  .aurora-btn{position:relative;overflow:hidden;isolation:isolate;--mx:50%;--my:50%}\n  .aurora-btn::before,.aurora-btn::after{\n    content:\"\";position:absolute;inset:-60%;z-index:-1;opacity:0;\n    transition:opacity .35s ease;pointer-events:none;\n    background:\n      radial-gradient(40% 55% at 25% 30%,#2dd4bf 0%,transparent 60%),\n      radial-gradient(45% 60% at 70% 25%,#4f9dff 0%,transparent 62%),\n      radial-gradient(50% 65% at 55% 80%,#9c6bff 0%,transparent 60%),\n      radial-gradient(40% 55% at 85% 75%,#f472b6 0%,transparent 60%);\n    background-size:200% 200%;animation:auroraDrift 6s ease-in-out infinite;\n  }\n  .aurora-btn::before{filter:blur(8px) saturate(1.3)}\n  .aurora-btn::after{\n    filter:blur(2px) saturate(1.6) brightness(1.4);\n    -webkit-mask:radial-gradient(120px 80px at var(--mx) var(--my),#000 0%,rgba(0,0,0,.25) 35%,transparent 70%);\n            mask:radial-gradient(120px 80px at var(--mx) var(--my),#000 0%,rgba(0,0,0,.25) 35%,transparent 70%);\n  }\n  .aurora-btn:hover{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55)}\n  .aurora-btn:hover::before{opacity:.55}\n  .aurora-btn:hover::after{opacity:1}\n  @keyframes auroraDrift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}\n  /* top-panel fields fill their (resizable) column so the custom type box always matches */\n  .fieldcol > input, .fieldcol > select{width:100% !important;box-sizing:border-box}\n  .fieldcol::-webkit-resizer{background:transparent}\n  /* table cells fill their (resizable) column; long text clips instead of forcing width */\n  [data-coltable] [data-rowid] > div{overflow:hidden;text-overflow:ellipsis}\n  [data-coltable] [data-rowid] input[data-f],\n  [data-coltable] [data-rowid] select[data-f],\n  [data-coltable] [data-rowid] [data-dropdown]{width:100% !important;min-width:0 !important;box-sizing:border-box}\n  [data-colresizer]:hover{background:var(--accent)}\n  /* native select dark-mode override */\n  [data-rowid] select[data-f], .fieldcol select {\n    background-color: var(--panel2) !important;\n    color: var(--txt) !important;\n    border-color: var(--line) !important;\n  }\n  [data-rowid] select[data-f] option, .fieldcol select option {\n    background-color: var(--panel2);\n    color: var(--txt);\n  }\n  [data-rowid] select[data-f]:focus, .fieldcol select:focus {\n    background-color: var(--panel) !important;\n    border-color: var(--accent) !important;\n    outline: none;\n  }\n  /* floating in-situ dropdown panel */\n  #rowDropPanel {\n    position:fixed;z-index:9999;min-width:130px;max-height:260px;overflow-y:auto;\n    background:var(--panel2,#1d2960);border:1px solid var(--accent,#60a5fa);\n    border-radius:9px;padding:5px 0;box-shadow:0 8px 32px rgba(0,0,0,.55);\n    display:none;\n  }\n  #rowDropPanel.open { display:block; animation:dropIn .13s ease; }\n  @keyframes dropIn (--pill);border:1px solid var(--line);border-radius:16px;padding:5px 6px 5px 12px;font-size:12px;font-weight:600\">{{v}}<button data-kind=\"cell\" data-v=\"{{v}}\" style=\"background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:50%\" style-hover=\"color:var(--bad)\">✕<\u002Fbutton><\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px\"><input id=\"newCell\" data-newkind=\"cell\" placeholder=\"Add cell line, e.g. RDKO12\" style=\"flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px 9px;font-size:12px;outline:none\" style-focus=\"border-color:var(--accent)\"><button data-add=\"cell\" style=\"background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:12px\">Add<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700\">Timepoints<\u002Fh3>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px\">\n            <sc-for list=\"{{settings.timepoints}}\" as=\"v\" hint-placeholder-count=\"2\"><span style=\"display:inline-flex;align-items:center;gap:5px;background:var(--pill);border:1px solid var(--line);border-radius:16px;padding:5px 6px 5px 12px;font-size:12px;font-weight:600\">{{v}}<button data-kind=\"tp\" data-v=\"{{v}}\" style=\"background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:50%\" style-hover=\"color:var(--bad)\">✕<\u002Fbutton><\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px\"><input id=\"newTp\" data-newkind=\"tp\" placeholder=\"Add timepoint, e.g. D18\" style=\"flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px 9px;font-size:12px;outline:none\" style-focus=\"border-color:var(--accent)\"><button data-add=\"tp\" style=\"background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:12px\">Add<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700\">Applications<\u002Fh3>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px\">\n            <sc-for list=\"{{settings.applications}}\" as=\"v\" hint-placeholder-count=\"2\"><span style=\"display:inline-flex;align-items:center;gap:5px;background:var(--pill);border:1px solid var(--line);border-radius:16px;padding:5px 6px 5px 12px;font-size:12px;font-weight:600\">{{v}}<button data-kind=\"app\" data-v=\"{{v}}\" style=\"background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:50%\" style-hover=\"color:var(--bad)\">✕<\u002Fbutton><\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px\"><input id=\"newApp\" data-newkind=\"app\" placeholder=\"Add application, e.g. ATAC\" style=\"flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px 9px;font-size:12px;outline:none\" style-focus=\"border-color:var(--accent)\"><button data-add=\"app\" style=\"background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:12px\">Add<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <h3 style=\"margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700\">Storage locations<\u002Fh3>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px\">\n            <sc-for list=\"{{settings.locations}}\" as=\"v\" hint-placeholder-count=\"2\"><span style=\"display:inline-flex;align-items:center;gap:5px;background:var(--pill);border:1px solid var(--line);border-radius:16px;padding:5px 6px 5px 12px;font-size:12px;font-weight:600\">{{v}}<button data-kind=\"loc\" data-v=\"{{v}}\" style=\"background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:50%\" style-hover=\"color:var(--bad)\">✕<\u002Fbutton><\u002Fspan><\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px\"><input id=\"newLoc\" data-newkind=\"loc\" placeholder=\"Add location, e.g. LN2 tank\" style=\"flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px 9px;font-size:12px;outline:none\" style-focus=\"border-color:var(--accent)\"><button data-add=\"loc\" style=\"background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:12px\">Add<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"grid-column:1/-1;border-top:1px solid var(--line);padding-top:18px\">\n          <h3 style=\"margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700\">Dark mode background<\u002Fh3>\n          <p style=\"margin:0 0 12px;font-size:11.5px;color:var(--muted)\">Pick a night-sky palette — applies when dark mode is on.<\u002Fp>\n          <div onclick=\"{{h.bgClick}}\" style=\"display:flex;flex-wrap:wrap;gap:12px\">\n            <sc-for list=\"{{bgPresets}}\" as=\"b\" hint-placeholder-count=\"6\">\n              <div data-bgpick=\"{{b.key}}\" style=\"cursor:pointer;width:128px;border-radius:10px;overflow:hidden;border:1px solid var(--line);box-shadow:{{b.ring}}\">\n                <div style=\"height:48px;background:{{b.preview}};position:relative\">\n                  <span style=\"position:absolute;left:9px;bottom:9px;width:14px;height:14px;border-radius:50%;background:{{b.accent}}\"><\u002Fspan>\n                  <span style=\"position:absolute;left:27px;bottom:9px;width:11px;height:11px;border-radius:50%;background:{{b.accent2}}\"><\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"padding:7px 10px;font-size:11.5px;font-weight:650;background:var(--panel2);display:flex;align-items:center;justify-content:space-between\"><span>{{b.name}}<\u002Fspan><span style=\"color:var(--accent2);font-weight:800\">{{b.check}}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"grid-column:1/-1;border-top:1px solid var(--line);padding-top:18px\">\n          <h3 style=\"margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700\">Backup &amp; restore<\u002Fh3>\n          <p style=\"margin:0 0 12px;font-size:11.5px;color:var(--muted);line-height:1.5\">Your log is saved only inside this exact file in this browser. Use a backup to move every workspace and sample to another computer or a fresh copy of this tool.<\u002Fp>\n          <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n            <button onclick=\"{{h.backupData}}\" style=\"background:var(--pill);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:9px 16px;cursor:pointer;font-weight:650;font-size:12.5px\" style-hover=\"border-color:var(--accent)\">⬇ Download backup (.json)<\u002Fbutton>\n            <button onclick=\"{{h.restoreClick}}\" style=\"background:var(--pill);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:9px 16px;cursor:pointer;font-weight:650;font-size:12.5px\" style-hover=\"border-color:var(--accent)\">⬆ Restore from backup<\u002Fbutton>\n            <input id=\"restoreFile\" type=\"file\" accept=\"application/json,.json\" onchange=\"{{h.restoreFile}}\" style=\"display:none\">\n          <\u002Fdiv>\n          <button onclick=\"{{h.factoryReset}}\" style=\"margin-top:14px;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.35);color:var(--bad);border-radius:6px;padding:9px 16px;cursor:pointer;font-weight:650;font-size:12.5px\" style-hover=\"background:rgba(248,113,113,.18)\">⟲ Factory reset — erase everything &amp; clear cache<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;position:sticky;bottom:0;background:var(--glass);backdrop-filter:blur(20px)\">\n        <button data-close=\"1\" style=\"background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:6px;padding:8px 18px;cursor:pointer;font-weight:700;font-size:13px\">Done<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- toast -->\n  <sc-if value=\"{{toast}}\" hint-placeholder-val=\"{{false}}\">\n  <div style=\"position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(20px);color:var(--txt);font-weight:650;padding:12px 20px;border-radius:10px;font-size:13px;z-index:99;box-shadow:0 12px 40px rgba(0,0,0,.4);border:1px solid var(--line);border-left:3px solid {{toast.accent}};display:flex;align-items:center;gap:14px;animation:dcSlideDown .3s ease\">\n    <span>{{toast.msg}}<\u002Fspan>\n    <sc-if value=\"{{toast.hasAction}}\" hint-placeholder-val=\"{{false}}\"><button onclick=\"{{h.toastAction}}\" style=\"background:var(--accent);border:none;border-radius:6px;padding:6px 14px;color:#fff;font-weight:700;font-size:12px;cursor:pointer\">{{toast.actionText}}<\u002Fbutton><\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.PART_ORDER = ['assay','cellline','sample','timepoint','treatment','application'];\n    this.PART_LABELS = {assay:'Assay',cellline:'Cell line',sample:'Exp.sample',timepoint:'Timepoint',treatment:'Treatment',application:'Application'};\n    this.CUSTOM = '__custom__';\n    this.LS = 'multiWsSampleTracker.v1';\n    this.OLD_LS = 'sampleLogInventory.v2';\n    this.WS_COLORS = ['#38bdf8','#5eead4','#a78bfa','#fbbf24','#f472b6','#34d399','#fb923c','#60a5fa'];\n    this.db = {\n      workspaces: [],\n      settings: { cellLines:['CTL1'], timepoints:Array.from({length:17},(_,i)=>'D'+i), applications:['RNA','FACS','cDNA'], locations:['4C','-20C','-80C'] },\n      parts: { assay:true, cellline:false, sample:false, timepoint:true, treatment:true, application:true },\n      sep: '_', theme:'dark', bgTheme:'midnight', uid:1, wsuid:1\n    };\n    this.ui = { activeId:null, filter:'', hideArchived:false, sort:{field:null,dir:'asc'}, colFilters:{}, selected:new Set(), settingsOpen:false, batchOpen:false, wsSort:'manual', showColFilters:false, viewMode:'table', calYear:new Date().getFullYear(), calMonth:new Date().getMonth(), qTreat:'', qApp:'', qAppCustom:'', colorEditId:null, colW:{} };\n    this.toastState = null;\n    this.undoBuffer = null;\n    this.newRowIds = new Set();\n    this._toastTimer = null;\n    this._saveTimer = null;\n    this.loadInitialData();\n  }\n\n  loadInitialData(){\n    this.load();\n    this.db.workspaces.forEach(w=>{ if(w.base && !w.base.harvest) w.base.harvest=this.today(); });\n    if(!this.db.workspaces.length){ this.db.workspaces.push(this.makeWs('Workspace 1')); }\n    if(!this.ui.activeId || (this.ui.activeId!=='total' && !this.db.workspaces.find(w=>w.id===this.ui.activeId))){\n      this.ui.activeId = this.db.workspaces[0].id;\n    }\n    if(this.activeWs()){ this.ui.qApp = (this.db.settings.applications[0]||''); }\n  }\n\n  _dropState = { id:null, field:null };\n  setupRowDropdown(){\n    const panel = document.getElementById('rowDropPanel');\n    if(!panel || panel._wired) return;\n    panel._wired = true;\n    // pick option\n    panel.addEventListener('mousedown', e=>{\n      const opt = e.target.closest('[data-opt]');\n      if(!opt) return;\n      e.preventDefault();\n      const { id, field } = this._dropState;\n      let val = opt.dataset.opt;\n      if(val === '__custom__'){\n        const ws = this.activeWs(); if(!ws) return;\n        const r = ws.records.find(x=>x.id===id); if(!r) return;\n        val = (prompt('Custom ' + field + ':', r[field]||'')||'').trim();\n        if(!val){ this.closeRowDropdown(); return; }\n      }\n      this.commitDropValue(id, field, val);\n      this.closeRowDropdown();\n    });\n    // close on outside click\n    document.addEventListener('click', e=>{\n      if(!panel.classList.contains('open')) return;\n      if(!panel.contains(e.target) && !e.target.closest('[data-dropdown]')) this.closeRowDropdown();\n    });\n  }\n  openRowDropdown(trigger){\n    const panel = document.getElementById('rowDropPanel');\n    if(!panel) return;\n    const field = trigger.dataset.f;\n    const id = trigger.dataset.id;\n    const ws = this.activeWs(); if(!ws) return;\n    const rec = ws.records.find(x=>x.id===id); if(!rec) return;\n    const opts = field==='cellline'\n      ? (this.db.settings.cellLines||['CTL1'])\n      : field==='application'\n        ? (this.db.settings.applications||['RNA','FACS','cDNA'])\n        : (this.db.settings.timepoints||[]);\n    const cur = rec[field]||'';\n    // build options HTML\n    panel.innerHTML = opts.map(o=>`<div data-opt=\"${o}\" class=\"${o===cur?'active':''}\">${o}<\u002Fdiv>`).join('')\n      + `<div data-opt=\"__custom__\" class=\"custom\">✎ Custom…<\u002Fdiv>`;\n    // position\n    const r = trigger.getBoundingClientRect();\n    panel.style.left = r.left + 'px';\n    panel.style.top = (r.bottom + 3) + 'px';\n    panel.style.minWidth = Math.max(r.width, 130) + 'px';\n    // flip up if off-screen\n    panel.classList.add('open');\n    const pr = panel.getBoundingClientRect();\n    if(pr.bottom > window.innerHeight - 10){\n      panel.style.top = (r.top - pr.height - 3) + 'px';\n    }\n    this._dropState = { id, field };\n    // highlight active\n    const activeEl = panel.querySelector('.active');\n    if(activeEl) activeEl.scrollIntoView({block:'nearest'});\n  }\n  closeRowDropdown(){\n    const panel = document.getElementById('rowDropPanel');\n    if(panel) panel.classList.remove('open');\n  }\n  commitDropValue(id, field, val){\n    const ws = this.activeWs(); if(!ws) return;\n    const r = ws.records.find(x=>x.id===id); if(!r) return;\n    r[field] = val;\n    if(r._dup) delete r._dup;\n    ws.editedAt = Date.now();\n    // update displayed value in trigger without full re-render\n    const trig = document.querySelector(`[data-dropdown][data-id=\"${id}\"][data-f=\"${field}\"]`);\n    if(trig){ const sp = trig.querySelector('[data-dropval]'); if(sp) sp.textContent = val; }\n    // update sample name span\n    const nm = document.getElementById('nm-'+id);\n    if(nm) nm.textContent = this.composeName(r)||'—';\n    this.save();\n  }\n  _dragRow = null;\n  setupRowDrag(){\n    const table = document.querySelector('[data-coltable]');\n    if(!table || table._dragWired) return;\n    table._dragWired = true;\n    // disable native row drag while the pointer is inside an editable control,\n    // so clicking into inputs / dropdowns / buttons doesn't start a drag\n    table.addEventListener('pointerdown', e=>{\n      const interactive = e.target.closest('input,select,textarea,button,[data-dropdown],[data-colresizer]');\n      const row = e.target.closest('[data-rowid]');\n      if(row) row.setAttribute('draggable', interactive ? 'false' : 'true');\n    });\n    table.addEventListener('dragstart', e=>{\n      const row = e.target.closest('[data-rowid]');\n      if(!row || row.getAttribute('draggable') === 'false') { e.preventDefault(); return; }\n      // can't reorder in Total (read-only) view\n      if(this.ui.activeId === 'total') { e.preventDefault(); return; }\n      this._dragRow = { el: row, id: row.dataset.rowid };\n      this._dropTarget = null;\n      e.dataTransfer.effectAllowed = 'move';\n      try { e.dataTransfer.setData('text/plain', row.dataset.rowid); } catch(_){}\n      row.style.opacity = '.4';\n    });\n    const clearMarks = ()=>{\n      table.querySelectorAll('[data-rowid]').forEach(r=>{ r.style.boxShadow=''; });\n    };\n    table.addEventListener('dragend', ()=>{\n      if(this._dragRow){ this._dragRow.el.style.opacity = '1'; }\n      clearMarks();\n      this._dragRow = null; this._dropTarget = null;\n    });\n    table.addEventListener('dragover', e=>{\n      if(!this._dragRow) return;\n      e.preventDefault();\n      e.dataTransfer.dropEffect = 'move';\n      const row = e.target.closest('[data-rowid]');\n      if(!row || row === this._dragRow.el){ return; }\n      const rect = row.getBoundingClientRect();\n      const isAfter = e.clientY > rect.top + rect.height/2;\n      clearMarks();\n      // drop indicator: top or bottom edge of the hovered row\n      row.style.boxShadow = isAfter\n        ? 'inset 0 -3px 0 0 var(--accent)'\n        : 'inset 0 3px 0 0 var(--accent)';\n      this._dropTarget = { id: row.dataset.rowid, after: isAfter };\n    });\n    table.addEventListener('drop', e=>{\n      if(!this._dragRow || !this._dropTarget){ clearMarks(); this._dragRow=null; return; }\n      e.preventDefault();\n      const ws = this.activeWs();\n      if(!ws){ clearMarks(); this._dragRow=null; this._dropTarget=null; return; }\n      const fromId = this._dragRow.id;\n      const { id: toId, after } = this._dropTarget;\n      clearMarks();\n      this._dragRow = null; this._dropTarget = null;\n      if(fromId === toId) { this.forceUpdate(); return; }\n      // reorder ws.records purely in the data model (no DOM mutation)\n      const recs = ws.records.slice();\n      const fromIdx = recs.findIndex(r=>r.id===fromId);\n      if(fromIdx < 0){ this.forceUpdate(); return; }\n      const [moved] = recs.splice(fromIdx, 1);\n      let toIdx = recs.findIndex(r=>r.id===toId);\n      if(toIdx < 0){ recs.push(moved); }\n      else { recs.splice(after ? toIdx+1 : toIdx, 0, moved); }\n      ws.records = recs;\n      ws.editedAt = Date.now();\n      // a manual order only makes sense without an active column sort\n      if(this.ui.sort && this.ui.sort.field){ this.ui.sort = {field:null, dir:'asc'}; }\n      this.save();\n      this.forceUpdate();\n    });\n  }\n  componentDidMount(){\n    this.forceUpdate();\n    setTimeout(()=>this.syncStaticInputs(), 0);\n    setTimeout(()=>this.setupCols(), 0);\n    setTimeout(()=>this.setupRowDropdown(), 0);\n    setTimeout(()=>this.setupRowDrag(), 0);\n\n    document.addEventListener('pointermove', e=>{\n      const btn = e.target.closest && e.target.closest('.aurora-btn');\n      if(!btn) return;\n      const r = btn.getBoundingClientRect();\n      btn.style.setProperty('--mx', (e.clientX - r.left) + 'px');\n      btn.style.setProperty('--my', (e.clientY - r.top) + 'px');\n    });\n  }\n\n  _COLDEF = { ws:90, name:210, assay:130, cellline:120, sample:140, timepoint:120, treatment:140, application:120, date:115, harvest:130, loc:95 };\n  setupCols(){\n    const table = document.querySelector('[data-coltable]');\n    if(!table) return;\n    const head = table.querySelector('[data-colhead]');\n    if(!head) return;\n    [...head.children].forEach(c=>{\n      const key = c.getAttribute('data-sort');\n      if(!key) return;\n      const minW = (this.ui.colW && this.ui.colW[key]) || this._COLDEF[key] || 80;\n      c.style.minWidth = minW + 'px';\n      c.style.position = 'relative';\n      if(!c.querySelector('[data-colresizer]')){\n        const h = document.createElement('div');\n        h.setAttribute('data-colresizer','');\n        h.style.cssText = 'position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize;z-index:6;opacity:.45';\n        h.addEventListener('pointerdown', (ev)=> this.startColResize(ev, key, c));\n        h.addEventListener('click', (ev)=> ev.stopPropagation());\n        c.appendChild(h);\n      }\n    });\n    // table width auto — let browser distribute remaining space\n    table.style.width = '100%';\n  }\n  startColResize(e, key, cell){\n    e.preventDefault(); e.stopPropagation();\n    const startX = e.clientX;\n    const startW = cell.getBoundingClientRect().width;\n    document.body.style.cursor = 'col-resize';\n    const move = (ev)=>{\n      const w = Math.max(48, Math.round(startW + (ev.clientX - startX)));\n      if(!this.ui.colW) this.ui.colW = {};\n      this.ui.colW[key] = w;\n      cell.style.minWidth = w + 'px';\n    };\n    const up = ()=>{\n      document.removeEventListener('pointermove', move);\n      document.removeEventListener('pointerup', up);\n      document.body.style.cursor = '';\n      this.save();\n    };\n    document.addEventListener('pointermove', move);\n    document.addEventListener('pointerup', up);\n  }\n\n  syncStaticInputs(){\n    const ws=this.activeWs();\n    const ae=document.activeElement;\n    // row editable inputs — defaultValue does not bind on dynamic mounts in the bundled runtime,\n    // so set each row input's value from its record imperatively.\n    const rowMap={};\n    this.getRows().forEach(r=>{ rowMap[r.id]=r; });\n    // sync row checkboxes (defaultChecked holes don't bind in the bundled runtime)\n    document.querySelectorAll('[data-role=\"rowcheck\"]').forEach(cb=>{\n      const host=cb.closest('[data-rowid]'); if(!host) return;\n      const shouldBeChecked=this.ui.selected.has(host.getAttribute('data-rowid'));\n      if(cb.checked!==shouldBeChecked) cb.checked=shouldBeChecked;\n    });\n    document.querySelectorAll('[data-rowid] input[data-f]').forEach(inp=>{\n      if(inp===ae || inp.type==='checkbox') return;\n      const host=inp.closest('[data-rowid]'); if(!host) return;\n      const rec=rowMap[host.getAttribute('data-rowid')]; if(!rec) return;\n      const v=rec[inp.dataset.f]==null?'':rec[inp.dataset.f];\n      if(inp.value!==v) inp.value=v;\n    });\n    document.querySelectorAll('[data-rowid] select[data-f]').forEach(sel=>{\n      if(sel===ae) return;\n      const host=sel.closest('[data-rowid]'); if(!host) return;\n      const rec=rowMap[host.getAttribute('data-rowid')]; if(!rec) return;\n      const v=rec[sel.dataset.f]==null?'':rec[sel.dataset.f];\n      if(v && ![...sel.options].some(o=>o.value===v)){ const op=document.createElement('option'); op.value=v; op.textContent=v; sel.insertBefore(op, sel.firstChild); }\n      if(sel.value!==v) sel.value=v;\n    });\n    if(!ws || this.ui.activeId==='total') return;\n    // base text/date inputs (skip selects, skip _custom, skip the focused field)\n    document.querySelectorAll('input[data-bf]').forEach(inp=>{\n      const f=inp.dataset.bf;\n      if(!f || f.endsWith('_custom') || f==='__wsname') return;\n      if(inp===ae) return;\n      const v=ws.base[f]; if(v==null) return;\n      if(inp.value!==v) inp.value=v;\n    });\n    // sync sepInput removed — separator is always _\n    // active tab name input\n    const tn=document.querySelector('input[data-tabname]');\n    if(tn && tn!==ae && tn.value!==ws.name) tn.value=ws.name;\n  }\n\n  componentDidUpdate(){\n    const ws=this.activeWs();\n    if(ws && this.ui.activeId!=='total'){\n      document.querySelectorAll('select[data-bf]').forEach(s=>{\n        const v=ws.base[s.dataset.bf];\n        if(v && [...s.options].some(o=>o.value===v)){ if(s.value!==v) s.value=v; }\n      });\n      const qa=document.getElementById('qAppSel');\n      if(qa && this.ui.qApp && [...qa.options].some(o=>o.value===this.ui.qApp)){ if(qa.value!==this.ui.qApp) qa.value=this.ui.qApp; }\n      this.syncStaticInputs();\n    }\n    this.setupCols();\n    this.setupRowDrag();\n    this.updatePreview();\n  }\n\n  /* ---------- persistence ---------- */\n  load(){\n    try{\n      const d = JSON.parse(localStorage.getItem(this.LS));\n      if(d){\n        if(Array.isArray(d.workspaces)) this.db.workspaces = d.workspaces;\n        if(d.settings) this.db.settings = {...this.db.settings, ...d.settings};\n        if(d.parts) this.db.parts = {...this.db.parts, ...d.parts};\n        if(d.sep!=null) this.db.sep = /^[-_./ ]?$/.test(d.sep) ? (d.sep||'_') : '_';\n        if(d.theme) this.db.theme = d.theme;\n        if(d.bgTheme) this.db.bgTheme = d.bgTheme;\n        if(d.wsuid) this.db.wsuid = d.wsuid;\n        if(d.uid) this.db.uid = d.uid;\n        // repair: older builds failed to persist `uid`, so the counter reset to 1\n        // each session and produced colliding record ids (multiple \"s1\"). Reassign\n        // any missing/duplicate ids and advance the counter past every existing id.\n        let maxU = Number.isFinite(this.db.uid) ? this.db.uid : 1;\n        this.db.workspaces.forEach(w=>(w.records||[]).forEach(r=>{ const m=/^s(\\d+)$/.exec(r.id||''); if(m) maxU=Math.max(maxU, (+m[1])+1); }));\n        const seenIds=new Set();\n        this.db.workspaces.forEach(w=>(w.records||[]).forEach(r=>{ if(!r.id || seenIds.has(r.id)){ r.id='s'+(maxU++); } seenIds.add(r.id); }));\n        this.db.uid = maxU;\n        this.save();\n        if(d.ui){\n          if(d.ui.activeId) this.ui.activeId = d.ui.activeId;\n          if(d.ui.wsSort) this.ui.wsSort = d.ui.wsSort;\n          if(d.ui.sort) this.ui.sort = d.ui.sort;\n          if(d.ui.colFilters) this.ui.colFilters = d.ui.colFilters;\n          if(typeof d.ui.hideArchived==='boolean') this.ui.hideArchived = d.ui.hideArchived;\n          if(typeof d.ui.showColFilters==='boolean') this.ui.showColFilters = d.ui.showColFilters;\n          if(d.ui.colW && typeof d.ui.colW==='object') this.ui.colW = d.ui.colW;\n        }\n        return;\n      }\n      // migrate from old single-list tool\n      const old = JSON.parse(localStorage.getItem(this.OLD_LS));\n      if(old && Array.isArray(old.records) && old.records.length){\n        const ws = this.makeWs('Imported');\n        ws.records = old.records calY, calM, 1).getDay();\n    const daysInMonth = new Date(calY, calM+1, 0).getDate();\n    const p2 = n=>String(n).padStart(2,'0');\n    // build activity maps from ALL workspaces (with detail)\n    const addedMap={}, consumedMap={};\n    this.db.workspaces.forEach(w=>w.records.forEach(r=>{\n      if(r.date){ (addedMap[r.date]=addedMap[r.date]||[]).push({r,ws:w}); }\n      if(r.archived){ const cd=r.consumedDate||r.date; if(cd){ (consumedMap[cd]=consumedMap[cd]||[]).push({r,ws:w}); } }\n    }));\n    const calSelectedDate = this.ui.calSelectedDate || todayStr;\n    const calCells=[];\n    for(let i=0;i<42;i++){\n      const dayOffset=i-firstDow; const dayNum=dayOffset+1;\n      const inMonth=dayNum>=1&&dayNum<=daysInMonth;\n      const dateStr=inMonth?`${calY}-${p2(calM+1)}-${p2(dayNum)}`:'';\n      const addedN=(addedMap[dateStr]||[]).length;\n      const consumedN=(consumedMap[dateStr]||[]).length;\n      const isToday=dateStr===todayStr;\n      const isSel=inMonth && dateStr===calSelectedDate;\n      calCells.push({dayNum:inMonth?String(dayNum):'',dateStr,inMonth,isToday,\n        hasAdded:addedN>0,hasConsumed:consumedN>0,\n        addedLabel:String(addedN),consumedLabel:String(consumedN),\n        bg: !inMonth?'transparent':(isSel?'rgba(56,189,248,.16)':(isToday?'rgba(56,189,248,.06)':'var(--panel)')),\n        border: isSel?'2px solid var(--accent)':(isToday?'1px solid var(--accent)':'1px solid var(--line)'),\n        opacity:inMonth?'1':'0.22',\n        dayColor:(isToday||isSel)?'var(--accent)':'var(--txt)',\n        cursor:inMonth?'pointer':'default'\n      });\n    }\n    const fmtDetail=(arr)=>(arr||[]).map(({r,ws:w})=>{\n      const meta=[r.cellline,r.timepoint,r.treatment,r.application].filter(Boolean).join(' · ');\n      return { name:this.composeName(r)||'—', ws:w.name, wsColor:w.color, meta, metaSep: meta?' · ':'' };\n    });\n    const calAddedList=fmtDetail(addedMap[calSelectedDate]);\n    const calConsumedList=fmtDetail(consumedMap[calSelectedDate]);\n    const sd=new Date(calSelectedDate+'T00:00:00');\n    const calDetailTitle = isNaN(sd.getTime()) ? calSelectedDate : sd.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});\n    const calHasAdded=calAddedList.length>0, calHasConsumed=calConsumedList.length>0;\n    const calEmpty=!calHasAdded&&!calHasConsumed;\n    const bgPresets = [\n      {key:'midnight', name:'Midnight', preview:'linear-gradient(135deg,#0b0f17,#1a2332)', accent:'#38bdf8', accent2:'#5eead4'},\n      {key:'ocean',    name:'Deep Ocean', preview:'linear-gradient(135deg,#06182e,#123353)', accent:'#38bdf8', accent2:'#5eead4'},\n      {key:'indigo',   name:'Indigo', preview:'linear-gradient(135deg,#0c0e20,#20264c)', accent:'#818cf8', accent2:'#c4b5fd'},\n      {key:'royal',    name:'Royal Blue', preview:'linear-gradient(135deg,#0a1033,#1d2960)', accent:'#60a5fa', accent2:'#a5b4fc'},\n      {key:'teal',     name:'Teal Night', preview:'linear-gradient(135deg,#04181b,#103940)', accent:'#2dd4bf', accent2:'#7dd3fc'},\n      {key:'aurora',   name:'Aurora', preview:'radial-gradient(125% 90% at 20% 0%,#243266,#0a0f24)', accent:'#7dd3fc', accent2:'#c4b5fd'}\n    ].map(b=>({ ...b, check: curBg===b.key?'✓':'', ring: curBg===b.key?'0 0 0 2px var(--accent)':'none' }));\n\n    const tabs = this.sortedWorkspaces().map(w=>{\n      const active = (w.id===this.ui.activeId && !isTotal);\n      const colorEdit = active && this.ui.colorEditId===w.id;\n      return {\n        id:w.id, name:w.name, count:w.records.length, dot:w.color,\n        active, inactive:!active, draggable:!active,\n        colorEdit, colorClosed: active && !colorEdit,\n        bg: active ? 'var(--bg)' : 'transparent',\n        color: active ? 'var(--txt)' : 'var(--muted)'\n      };\n    });\n\n    const sortArrow=f=> this.ui.sort.field===f ? (this.ui.sort.dir==='asc'?'\\u25B2':'\\u25BC') : '';\n    const arr={ ws:sortArrow('ws'), name:sortArrow('name'), assay:sortArrow('assay'), cellline:sortArrow('cellline r.application||'').trim())||'Unassigned'; (appBuckets[a]=appBuckets[a]||[]).push(r); });\n    const boxAppNames = Object.keys(appBuckets).sort((a,b)=>a.localeCompare(b));\n    const boxFilter = (this.ui.boxFilter && appBuckets[this.ui.boxFilter]) ? this.ui.boxFilter : null;\n    const boxChips = [{ name:'All', key:'__all__', active:!boxFilter, count:rows.length }]\n      .concat(boxAppNames.map(a=>({ name:a, key:a, active:boxFilter===a, count:appBuckets[a].length })))\n      .map(c=>({ ...c, bg:c.active?'var(--accent)':'var(--pill)', border:c.active?'var(--accent)':'var(--line)', color:c.active?'#fff':'var(--muted)' }));\n    const shownApps = boxFilter ? [boxFilter] : boxAppNames;\n    const boxGroups = shownApps.map(a=>{\n      const list = appBuckets[a];\n      const activeN = list.filter(r=>!r._archived).length;\n      const consumedN = list.length - activeN;\n      const slots = list.map(r=>{\n        const consumed = !!r._archived;\n        const meta=[r.cellline,r.timepoint,r.treatment].filter(Boolean).join(' · ');\n        return {\n          name:r._name, hasMeta:!!meta, meta,\n          dotColor: r._wsColor || boxDefColor,\n          slotBg: consumed ? 'var(--panel2)' : 'rgba(56,189,248,.07)',\n          slotBorder: consumed ? '1px dashed var(--line)' : '1px solid var(--accent)',\n          nameStyle: consumed ? 'text-decoration:line-through;text-decoration-color:var(--warn);color:var(--muted)' : 'color:var(--txt)'\n        };\n      });\n      return { app:a, activeLabel:activeN+' active', consumedLabel:consumedN+' consumed', hasConsumed:consumedN>0, slots };\n    });\n    const boxEmpty = boxGroups.length===0;\n\n    return {\n      theme:this.db.theme, bgTheme:this.db.bgTheme||'midnight', bgPresets,\n      isTotal, notTotal:!isTotal, activeId:this.ui.activeId,\n      showEditor: !isTotal && (this.ui.viewMode||'table')==='table',\n      showTotalNotice: isTotal && (this.ui.viewMode||'table')==='table',\n      tableView: (this.ui.viewMode||'table')==='tab
